global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: agentforge

scrape_configs:
  # FastAPI backend exposes prometheus-client metrics at /metrics
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: agentforge-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
