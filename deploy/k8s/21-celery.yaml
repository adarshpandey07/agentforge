apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: agentforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: worker
          image: agentforge/backend:latest # same image as backend
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: agentforge-config
            - secretRef:
                name: agentforge-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$(HOSTNAME)"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
